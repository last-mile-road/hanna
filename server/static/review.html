<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>HANNA — rever valores</title>
<link rel="stylesheet" href="/static/bench.css?v=14">
<link rel="stylesheet" href="/static/review.css?v=16">
</head>
<body class="review">
<header>
  <div class="brand">HANNA</div>
  <label class="dev-toggle">
    <input type="checkbox" id="dev-mode" checked>
    <span>modo desenvolvimento</span>
  </label>
</header>

<main>
  <div id="loading" class="hint">A carregar…</div>
  <div id="topline" class="hidden">
    <span id="verdict-badge" class="badge"></span>
    <button id="next-issue" class="link-button">Ir para o primeiro problema</button>
    <span id="saved" class="saved"></span>
  </div>
  <section id="sections"></section>
</main>

<footer class="review-footer">
  <span id="progress">0 revistos</span>
  <button id="finish">Terminar</button>
</footer>
<script src="/static/review.js?v=18"></script>
</body>
</html>
