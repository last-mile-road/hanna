<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — HANNA</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         background:#f6f7f9; color:#1c1f23; }
  main { width:min(92vw, 360px); background:#fff; border:1px solid #dde1e6;
         border-radius:12px; padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.sub { margin:0 0 22px; color:#5b6470; font-size:.9rem; }
  label { display:block; font-size:.85rem; margin:14px 0 6px; color:#3b424b; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; font:inherit;
          border:1px solid #c9cfd6; border-radius:8px; background:#fff; color:inherit; }
  input:focus { outline:2px solid #2f6fed; outline-offset:1px; border-color:#2f6fed; }
  button { width:100%; margin-top:20px; padding:11px; font:inherit; font-weight:600;
           color:#fff; background:#1f5bd7; border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #error { margin-top:14px; color:#a3231f; font-size:.88rem; min-height:1.2em; }
  footer { margin-top:22px; font-size:.78rem; color:#6b7480; }
</style>
</head>
<body>
<main>
  <h1>HANNA</h1>
  <p class="sub">Sign in to the test platform.</p>
  <form id="form" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
    <div id="error" role="alert"></div>
  </form>
  <footer>Invitation only. Access is arranged with the programme.</footer>
</main>
<script>
  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    submit.disabled = true;
    try {
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        error.textContent = body.detail || "Sign-in failed.";
        return;
      }
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.href = next.startsWith("/") ? next : "/";
    } catch (err) {
      error.textContent = "Network error. Try again.";
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
