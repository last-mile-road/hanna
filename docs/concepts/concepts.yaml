- id: referred_by
  who_name: Referred by
  value_type: choice_single
  options:
  - Community volunteer
  - Health worker
  - Private practitioner
  - Person affected by leprosy
  - Transferred-in (under treatment)
  options_source: who
  observed:
  - family member
  - volunteer
  - traditional healer
  - self referred
  - other
  observed_source: 53 reviewed jobs, who_referred
  sensitivity: administrative
  tier: core
  aliases:
  - who_referred
  value_aliases:
    trazido por familiar: family member
    familiar: family member
    family member: family member
    trazido pelo voluntário: volunteer
    voluntário: volunteer
    voluntario: volunteer
    volunteer: volunteer
    auto-referido: self referred
    self-referred: self referred
    self referred: self referred
    curandeiro tradicional: traditional healer
    traditional healer: traditional healer
    outra situação: other
    outro situação: other
    outro: other
    other: other
    veio sozinho: self referred
    veio por si: self referred
    transferido pelo médico tradicional: traditional healer
    médico tradicional: traditional healer
    curandeiro: traditional healer
  note: 'WHO''s list and the card''s list disagree almost completely. Card: family
    member, volunteer, traditional healer, self referred, other. The Portuguese phrases
    on the card map through value_aliases.'
- id: mode_of_detection
  who_name: Mode of detection
  value_type: choice_single
  options:
  - Active case detection campaigns (general population)
  - Active case detection campaigns (special population group)
  - Contact examination
  - School health examination
  - Voluntary (self-presented)
  - Referral
  options_source: who
  sensitivity: administrative
  tier: core
  aliases: []
  note: Absent from the Mozambique card as a distinct field; partly implied by referred_by.
- id: skin_patch_count
  who_name: Number of skin patches
  value_type: integer
  sensitivity: clinical
  tier: core
  aliases:
  - nr_skinpatches
  note: 70% over 53 reviewed jobs, the weakest block apart from the foot tests. Patches
    are drawn on a body diagram; counting is an interpretation, not an OCR read.
- id: body_area_percentage
  who_name: Percentage of body area affected
  value_type: percent
  sensitivity: clinical
  tier: extended
  ground_truth: false
  derived: true
  internal: true
  aliases:
  - body_area_percentage
  note: A visual estimate by the VLM, not a filled card field. Keep it in the ledger
    as a severity/complication proxy and as training material for a future fine-tune;
    do not score it against a sheet.
- id: skin_lesion_notes
  who_name: Description of skin lesions
