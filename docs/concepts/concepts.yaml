- id: eye_blinking_right
  who_name: Blinks spontaneously, right eye
  value_type: choice_single
  options:
  - 'Yes'
  - 'No'
  options_source: observed
  sensitivity: clinical
  tier: core
  aliases:
  - right_eye_blinking
  - pestanejo olho direito
  note: Observed without prompting the patient. A missing blink reflex suggests loss
    of sensation in the eye. Do not conflate with eye closure (eye_lagophthalmos_right).
  cardinality: many
- id: eye_blinking_left
  who_name: Blinks spontaneously, left eye
  value_type: choice_single
  options:
  - 'Yes'
  - 'No'
  options_source: observed
  sensitivity: clinical
  tier: core
  aliases:
  - left_eye_blinking
  - pestanejo olho esquerdo
  note: Observed without prompting. Absence suggests loss of sensation. Eye closure
    is a separate measurement.
  cardinality: many
- id: eye_lagophthalmos_right
  who_name: Lagophthalmos, right (eyelid gap)
  value_type: integer
  unit: mm
  sensitivity: clinical
  tier: core
  aliases:
  - right_eye_lagoft
  - lagoftalmia direita
  note: After asking the patient to close the eyes, measure the gap between the eyelids
    in mm. 0 means full closure. A gap indicates muscle paralysis (orbicularis oculi).
    A negative sign is a misread; any number except 0 is a positive measurement.
  cardinality: many
- id: eye_lagophthalmos_left
  who_name: Lagophthalmos, left (eyelid gap)
  value_type: integer
  unit: mm
  sensitivity: clinical
  tier: core
  aliases:
  - left_eye_lagoft
  - lagoftalmia esquerda
  note: After asking the patient to close the eyes, measure the gap between the eyelids
    in mm. 0 means full closure. A gap indicates muscle paralysis. A negative sign
    is a misread; any number except 0 is a positive measurement.
  cardinality: many
- id: hand_ulnar_right
  who_name: Hypothenar muscle strength (ulnar), right hand
  value_type: choice_single
  options:
  - Normal
  - Weak
  - Paralysed
  options_source: standard
  card_marks:
    N: Normal
    F: Weak
    A: Paralysed
  sensitivity: clinical
  tier: core
  aliases:
  - right_hipothenar
  note: 'Muscle testing result. Card marks: N = Normal, F = Fraco (weak), A = Ausente
    (no function, paralysed). Stored in English. Visible clawing or wasting belongs
    to the body-diagram annotation, not here.'
