meta:
  version: '0.1'
  created: '2026-10-23'
  status: draft
  who_source: WHO DHIS2 case-based leprosy guidance 2025, §4.2
  sensitivity_classes:
  - identifying
  - clinical
  - administrative
concepts:
- id: patient_name
  who_name: First name / Middle name / Last name
  value_type: person_name
  sensitivity: identifying
  tier: core
  aliases:
  - patient_name
  - name
  - nome do doente
  note: Mozambique card has one name field; WHO splits into three. Treat as one string
    until a country needs the split.
- id: patient_id
  who_name: Patient ID (autogenerated)
  value_type: code_number
  sensitivity: identifying
  tier: core
  aliases:
  - unique_nr
  - número do doente
  - nil
  note: 'The government number, the card''s ''Numero Individual do doente de Lepra
    (NIL)''. It sits in the only fixed box on the card: template coordinates 679,206
    to 1462,382. Format varies by country, so it cannot be validated arithmetically;
    check it against the national register when one exists, otherwise require a human
    confirmation. Blank until the case is notified, so it cannot be the key at first
    capture. See hanna_next/CARD_IDENTITY.md.'
- id: hanna_case_id
  who_name: HANNA case ID
  value_type: code_number
  sensitivity: identifying
  tier: core
  ground_truth: false
  aliases: []
  note: Only needed while no official number exists on the card, if the national programme
    allocates its number separately. Written in a region anchored to the government
    number box, not searched for across the page. Superseded by the official number
    when it appears, and kept for audit. Not present on any current test card, so
    not scored. See hanna_next/CARD_IDENTITY.md section 4.3.
- id: previous_patient_id
  who_name: Any previous patient ID
  value_type: code_number
  sensitivity: identifying
  tier: core
  aliases: []
  note: A real previous patient ID, if a card carries one. The Mozambique card's 'Pessoa
    de Referência' is a person, not this field.
- id: reference_person
  who_name: Reference person (community contact)
  value_type: person_name
  sensitivity: identifying
  tier: local
  aliases:
  - patient_reference
  note: A person close to the patient, a community contact who can be reached. It
    is not a patient ID. The NIL/government number is patient_id. Confirmed by the
    owner, 2026-10-26.
- id: contact_number
  who_name: Contact number
  value_type: phone_number
  sensitivity: identifying
  tier: core
  aliases:
  - cellphone_nr
- id: date_of_birth_or_age
  who_name: Date of birth/ Age
  value_type: date_or_age
  sensitivity: identifying
  tier: core
  aliases:
  - birth_year
  note: The card prints "Ano de nascimento/Idade"; the clinic writes either a birth
    year (1991) or an age (35). Return it exactly as written. An age becomes a birth
    year only when the reference year is known (CONSTRAINTS §1.6).
- id: gender
  who_name: Gender
  value_type: choice_single
  options:
  - Male
  - Female
  - Others
  options_source: who
  observed:
  - M
  - F
  observed_source: 53 reviewed jobs; the card uses M/F tickboxes
  sensitivity: clinical
  tier: core
  aliases:
  - gender
  - sexo
  note: 'Card options are M/F only. WHO adds Others, which the card cannot express.
    Map M->Male, F->Female. Classed clinical, not identifying: PURPOSE.md §6 names
    names, IDs, phone and address as identifying, and sex alone does not identify
    a person.'
- id: current_address
  who_name: Current address
  value_type: text
  sensitivity: identifying
  tier: core
  ground_truth: false
  aliases: []
  note: Mozambique card decomposes address into district/locality/village rather than
    one field, so this concept is never scored on this card.
- id: district
  who_name: District
  value_type: text
  sensitivity: administrative
  tier: core
  aliases:
  - district
  - distrito
  note: Resolved against the country hierarchy (location.yaml), not free text.
- id: locality
  who_name: Administrative post / locality
  value_type: text
  sensitivity: identifying
  tier: core
  aliases:
  - locality
  - localidade
  note: Quasi-identifier when combined with name and village. Flagged identifying
    to be safe.
- id: village
  who_name: Village
  value_type: text
  sensitivity: identifying
  tier: core
  aliases:
  - village_name
  - aldeia
  - unidade sanitária
- id: case_category
  who_name: Case category
  value_type: choice_single
  options:
  - New
  - Transferred in
  - Retreatment
  options_source: who
  observed:
  - new_case
  - re_entry
  - re_infection
  - wrong_classification
  observed_source: 53 reviewed jobs, admin_classification
  sensitivity: clinical
  tier: core
  aliases:
  - admin_classification
  note: 'Mismatch: the card''s four options do not map 1:1 onto WHO''s three. Needs
    a clinical decision, not a code change.'
- id: retreatment_type
  who_name: Retreatment type
  value_type: choice_single
  options:
  - Relapse
  - Treatment after loss to follow-up (LFU)
  - Others
  options_source: who
  sensitivity: clinical
  tier: core
  aliases: []
  note: Not a separate field on the Mozambique card. Absent, not forgotten.
- id: transferred_from
  who_name: Transferred from (facility)
  value_type: text
  sensitivity: administrative
  tier: extended
  aliases:
  - transferred_from
- id: classification
  who_name: Leprosy classification (PB/MB, adult/child)
  value_type: choice_single
  options:
  - PB_child
  - PB_adult
  - MB_child
  - MB_adult
  options_source: observed
  observed:
  - MB_adult
  - PB_adult
  - MB_child
  - PB_child
  sensitivity: clinical
  tier: core
  aliases:
  - leprosy_classification
- id: date_diagnosed
  who_name: Date of diagnosis
  value_type: date
  sensitivity: clinical
  tier: core
  aliases:
  - date_diagnosed
  note: Supplies the reference year for birth-year arithmetic when present.
- id: other_registration_comments
  who_name: null
  value_type: text
  sensitivity: administrative
  tier: local
  aliases:
  - other_admin_comments
- id: symptom_duration
  who_name: Duration of symptoms
