# Local experimentation: OpenRouter for the language work, MinerU on this machine for the
# two tables. No Modal box, no GPU rental.
# Start the reader once:
#   mineru-api --host 127.0.0.1 --port 8001 --tier standard --allow-local-source --preload-models
# Then, for the server and the worker:
#   MINERU_LOCAL_BASE=http://127.0.0.1:8001 HANNA_ROUTING_FILE=routing-local.yaml ...
# Agreed default: OpenRouter for the VLM, local MinerU for the printed tables.
# The 8B is the fast pass for the blocks measured to read well with it; the 9B
# stays the default/fallback and is used for demographics. No Modal.com box.
strips: or-qwen3vl-8b-v1
fallback: or-qwen35-9b-v1
default: or-qwen35-9b-v1
