# Tick columns, proposed from the printed boxes on the blank template (2026-10-30).
# AWAITING THE OWNER'S VISUAL CONFIRMATION before any of this is used.
#
# Method: contour detection on the template, then one strip per question group with
# 20 px of padding all round. The numbers are drawn inside the strip; the prompt is given
# the band -> (question, option) mapping, so the model answers with band numbers only.
# Coordinates are template pixels (3332 x 2502).

