# Tick columns, measured on the blank template (2026-10-30) and confirmed by the owner.
# One strip per printed question. The prompt carries the question and the band -> option
# mapping, so the model answers with band numbers and never reads an option name.
# Coordinates are template pixels (3332 x 2502). Rendering is tools/render_tick_strip.py.

clinical_history:
  groups:
    - concept: itching
      pair: skinpatch_itching
      question: "As lesões da pele dão comichão?"
      strip: [1340, 1194, 1411, 1314]
      bands: [[1360, 1214, 31, 30], [1360, 1263, 30, 31]]
      options: ["Yes", "No"]
      labels: [sim, "não"]

    - concept: leprosy_contact
      pair: leprosy_contact
      question: "O doente tem familiares/vizinhos/amigos com Lepra?"
      strip: [1340, 1388, 1412, 1508]
      bands: [[1360, 1408, 32, 32], [1360, 1458, 32, 30]]
      options: ["Yes", "No"]
      labels: [sim, "não"]

    - concept: previous_leprosy_treatment
      pair: previous_leptreatment
      question: "O doente já teve o diagnóstico e tratamento de Lepra no passado?"
      strip: [1341, 1535, 1412, 1654]
      bands: [[1361, 1555, 31, 31], [1361, 1604, 31, 30]]
      options: ["Yes", "No"]
      labels: [sim, "não"]

    - concept: referred_by
      pair: who_referred
      question: "Quem trouxe o doente à consulta?"
      strip: [1340, 1683, 1413, 1948]
      bands: [[1362, 1703, 30, 29], [1360, 1750, 32, 32], [1360, 1800, 32, 30],
              [1362, 1849, 30, 31], [1360, 1898, 33, 30]]
      options: [self referred, volunteer, family member, traditional healer, other]
      labels: [veio sozinho, trazido pelo voluntário, trazido por familiar,
               transferido pelo médico tradicional, outra situação]

case_category:
  concept: case_category
  pair: admin_classification
  question: "Tipo de doente entrado"
  strip: [548, 1000, 621, 1266]
  bands: [[570, 1020, 30, 32], [571, 1118, 29, 30], [568, 1168, 33, 30], [571, 1216, 30, 30]]
  options: [new_case, re_entry, wrong_classification, re_infection]
  labels: [Caso novo, Reentrado após abandono, Má classificação, Recaída]
  note: the last band sits close to the section rule; left as is

leprosy_classification:
  concept: classification
  pair: leprosy_classification
  question: "Classificação da lepra"
  strip: [552, 1441, 624, 1803]
  bands: [[572, 1461, 31, 32], [571, 1556, 34, 32], [573, 1656, 31, 31], [574, 1753, 31, 30]]
  options: [MB_adult, PB_adult, MB_child, PB_child]
  labels: [MB adulto, PB adulto, MB criança, PB criança]

gender:
  concept: gender
  pair: gender
  question: "Sexo"
  strip: [1138, 503, 1448, 582]
  split_x: 1305
  bands: [[1138, 503, 167, 79], [1305, 503, 143, 79]]
  options: [M, F]
  labels: [M, F]
  note: horizontal row; cut-and-stack at the split, band 1 = M, band 2 = F

render:
  left_margin_px: 56
  border_px: 12
  number_scale: 1.2
  number_thickness: 3
  stack_gap_px: 70
