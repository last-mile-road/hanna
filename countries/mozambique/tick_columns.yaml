       options: [Yes, No]}
    - {concept: leprosy_contact, strip: [1340, 1388, 1412, 1508], bands: [[1360, 1408, 32, 32], [1360, 1458, 32, 30]],
       options: [Yes, No]}
    - {concept: previous_leprosy_treatment, strip: [1341, 1535, 1412, 1654], bands: [[1361, 1555, 31, 31], [1361, 1604, 31, 30]],
       options: [Yes, No]}
    - {concept: referred_by, strip: [1340, 1683, 1413, 1948],
       bands: [[1362, 1703, 30, 29], [1360, 1750, 32, 32], [1360, 1800, 32, 30], [1362, 1849, 30, 31], [1360, 1898, 33, 30]],
       options: [self referred, volunteer, family member, traditional healer, other]}

