# Review layout — presentation only. Nothing here changes extraction or scoring.
#
# The review screen reads this to decide how a block is shown: as a table that mirrors the
# card, as plain rows, or not at all. It is country data, not code (PURPOSE §5).

# Fields a clinician must look at before "Terminar" closes this side. A hard
# gate: the review refuses to finish while one of them has no decision. Keep it
# short — every field here is a keystroke the reviewer cannot skip.
required_review:
  - patient_name
  - birth_year
  - gender
  - date_diagnosed
  - leprosy_classification
  - admin_classification

# Location is confirmed on a map, never typed into a list of fields.
hidden:
  - district
  - locality
  - village_name

# Useful while developing, noise for a clinician. Shown only with "modo desenvolvimento".
dev_only:
  - body_area_percentage
  - skinpatch_notes
  - hand_feet_notes
  - is_filled
  - unique_nr

# Tables mirror the printed card so a reviewer compares position by position.
tables:
  - id: nerves
    block: nerve_assessment
    title: Palpação dos nervos periféricos
    columns: [Cubital D, Cubital E, Radial D, Radial E, Poplíteo D, Poplíteo E]
    rows:
      - label: Grosso
        cells:
          - nerve_enlargement_cubital_right
          - nerve_enlargement_cubital_left
          - nerve_enlargement_radial_cutaneous_right
          - nerve_enlargement_radial_cutaneous_left
          - nerve_enlargement_popliteal_external_right
          - nerve_enlargement_popliteal_external_left
      - label: Dor
        cells:
          - nerve_pain_cubital_right
          - nerve_pain_cubital_left
          - nerve_pain_radial_cutaneous_right
          - nerve_pain_radial_cutaneous_left
          - nerve_pain_popliteal_external_right
          - nerve_pain_popliteal_external_left

  - id: insensitive_points
    block: hand_feet_assessment
    title: Pontos insensíveis
    note: Contagem de pontos insensíveis em cada mão e pé (0 a 8). É um número, não um grau.
    columns: [Direito, Esquerdo]
    rows:
      - label: Mão
        cells: [insensitive_points_right_hand, insensitive_points_left_hand]
      - label: Pé
        cells: [insensitive_points_right_foot, insensitive_points_left_foot]

  - id: eye_exam
    block: def_exam
    title: Exame dos olhos
    columns: [Direito (D), Esquerdo (E)]
    rows:
      - label: Pestanejo (+/-)
        cells: [right_eye_blinking, left_eye_blinking]
      - label: Lagoftalmia (mm)
        cells: [right_eye_lagoft, left_eye_lagoft]

  - id: muscles
    block: def_exam
    title: Testagem dos músculos voluntários
    columns: [Direito (D), Esquerdo (E)]
    rows:
      - label: Abdução dos dedos mínimos
        cells: [right_hipothenar, left_hipothenar]
      - label: Dorsi-flexão dos pés
        cells: [right_foot_dorsiflex, left_foot_dorsiflex]

  - id: grades
    block: def_exam
    title: Graus de deformidade (0, 1 ou 2)
    columns: [Direito (D), Esquerdo (E)]
    rows:
      - label: Olhos
        cells: [ehf_right_eye, ehf_left_eye]
      - label: Mãos
        cells: [ehf_right_hand, ehf_left_hand]
      - label: Pés
        cells: [ehf_right_foot, ehf_left_foot]

