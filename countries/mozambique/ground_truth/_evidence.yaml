        says:
          nerve_enlargement_row: "-,+,-,-,-,+"
          nerve_pain_row: "-,-,-,+,-,-"
      - source: "hanna_archive/notes/AI_self_make.txt (line 23)"
        says:
          nr_skinpatches: "2 front + 2 back = 4"
      - source: "hanna_archive/versions/v4_hanna3_2025-2026/MOBILE_APP4/corrected_ground_truth.py"
        says:
          nerve_enlargement_row: "-+---+"
          nerve_pain_row: "---+--"
