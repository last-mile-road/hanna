# Ground-truth evidence ledger — Mozambique card
#
# Every value in a ground_truth/*.json file must trace to a row here. Nothing
# enters a ground-truth sheet from inference: only from a human statement, a
# corrected record, or a note written by the owner.
#
# Statuses used downstream:
#   verified  - a human stated it, and the source is named
#   partial   - some fields verified, the rest still pending
#   pending   - skeleton only, nothing known
#
# The owner is the only person who can move a value from pending to verified.

nerve_column_order:
  # hanna_archive/notes/nerve_coordinates.txt, lines 4-10
  order: [cubital_right, cubital_left, radial_cutaneous_right, radial_cutaneous_left, popliteal_external_right, popliteal_external_left]
  source: "hanna_archive/notes/nerve_coordinates.txt"
  note: "Left to right on the card. Both rows use the same order."

