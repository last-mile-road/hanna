form:
  id: mozambique_back_card
  country: mozambique
  variant: back
  template: template.back.jpg
  status: draft
  reference_year: 2026
  note: 'v3: one wide visit index; per visit nerve, sensory and def_exam (eye + muscles + grades in one
    block, like the front); reactions read by strips; outcome date/choice/free text separate. Bboxes measured
    from template.back.jpg (3229x2303); overlay in docs/diagnostics.'
blocks:
- id: visit_index
  block_type: value_pairs
  bbox:
  - 6
  - 6
  - 2457
  - 159
  hint: 'The card has four visit headers side by side. Each has a handwritten date under Data: and a name
    under Preenchido por:. Read each visit date and name; an empty header is null. Do not use a printed
    label as a value.'
  value_pairs:
  - id: v1_visit_date
    concept: visit_date
    label_local: Visita 1 — Data
  - id: v1_recorded_by
    concept: recorded_by
    label_local: Visita 1 — Preenchido por
