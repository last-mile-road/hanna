  - 159
  - 617
  - 517
  hint: Tabela de palpação dos nervos periféricos. Colunas D (direita) e E (esquerda); linhas Grosso (nervo
    engrossado) e Dor (nervo doloroso). Leia a célula na intersecção; uma célula vazia é null.
