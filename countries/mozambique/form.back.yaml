    label_local: Radial E — Dor
  - id: v1_nerve_pain_popliteal_external_right
    concept: nerve_pain_popliteal_external_right
    label_local: Poplíteo D — Dor
  - id: v1_nerve_pain_popliteal_external_left
    concept: nerve_pain_popliteal_external_left
    label_local: Poplíteo E — Dor
- id: visit1_sensory
  block_type: visual_annotation
  bbox:
  - 3
  - 517
  - 617
  - 1614
  hint: 'Rules for this diagram:

    - The left half is column D = the patient''s right; the right half is column E = the patient''s left.

    - An X marks an insensitive point. A tick, a dot or a printed mark is NOT an X.

    - A filled black circle is an ulcer, not an insensitive point.

    - A blacked-out or amputated digit is a complication, not an X.

    - Count only X marks, separately for the hand and the foot.

    - Answer the four complication fields with Yes or No. Look at the four drawings: an open sore, a missing
    digit or limb, a claw hand, or anything else marked that is not an X and not a tick. More than one
    can be Yes.

    - If any complication is Yes, the notes field must be a sentence, not the word ''úlcera'' or ''amputação''.
    Give the location (hand or foot, and which digit if visible) and the approximate size when the card
    shows one, for example ''úlcera de 2 cm na base do polegar direito''. Never invent a size. If the
    diagram does not show where it is, write what is visible and nothing more.'
  value_pairs:
  - id: v1_insensitive_points_right_hand
    concept: insensitive_points_right_hand
    label_local: Mão D — pontos insensíveis
  - id: v1_insensitive_points_left_hand
