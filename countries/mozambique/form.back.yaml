  - id: v1_nerve_enlargement_radial_cutaneous_right
    concept: nerve_enlargement_radial_cutaneous_right
    label_local: Radial D — Grosso
  - id: v1_nerve_enlargement_radial_cutaneous_left
    concept: nerve_enlargement_radial_cutaneous_left
    label_local: Radial E — Grosso
  - id: v1_nerve_enlargement_popliteal_external_right
    concept: nerve_enlargement_popliteal_external_right
    label_local: Poplíteo D — Grosso
  - id: v1_nerve_enlargement_popliteal_external_left
