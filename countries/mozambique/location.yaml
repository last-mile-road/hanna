# Mozambique — location hierarchy and resolver declaration
#
# The hierarchy is data, not code. The card prints district and "localidade" but
# not province; the resolver infers province from district (all 161 ADM2 names
# are unique in COD-AB v02) and uses the facility context as a fallback.

country: mozambique
gazetteer:
  admin_units: gazetteer/admin_units.csv     # OCHA COD-AB v02, 2025-01-01
  facilities: gazetteer/facilities.csv       # MFL / SIS-MA via HDX
  admin_source: "OCHA COD-AB v02; ADM1/2 p-codes from INE, ADM3/4 generated by OCHA"
  facility_source: "Mozambique Master Health Facility List, SIS-MA; date unknown"
  admin_counts: {province: 11, district: 161, administrative_post: 457, locality: 1712}
  facility_count: 1590

levels:                       # ordered, top to bottom
  - province
  - district
  - administrative_post
  - locality
  - village                     # ADM4 / place name when it is not a facility
  - facility                    # MFL point; card "Unidade Sanitária"

card_mapping:
  district: district            # ADM2
  locality: administrative_post # ADM3; Impiri is the exception, matched as a facility
  village_name: [facility, locality, village]  # "Unidade Sanitária / Aldeia"
  province: null                # not printed on the card

province:
  on_card: false
  infer_from: district
  unique_districts: true        # 161 ADM2 names, 161 unique in COD-AB v02
  fallback: facility.province
  ui: "show inferred province and allow correction"

match:
  language: pt
  normalize: [diacritics, case, punctuation, whitespace, common_prefixes]
  # prefixes to strip: "posto administrativo de", "localidade de", "aldeia de",
  # "vila de", "bairro de", "centro de saude de", "unidade sanitaria de"
  candidate_sources: [gazetteer, alias_table]
  algorithm: rapidfuzz_ratio   # token-aware, accent-insensitive, candidate-restricted
  thresholds:
    auto_accept: 85            # exact or near-exact after Portuguese normalization
    review: 70                 # show top candidates; human confirms
    margin: 10                 # top must beat second by this much for auto
  never_fuzzy: [phone_number, code_number, gender, person_name]
  # Maria stays Maria; Marie is a different name. Person names are exact after
  # accent/case normalization, never edited to a different name.

tiers:
  1:
    - admin_units             # exact/fuzzy district, ADM3, ADM4 + centroid
    - facilities              # facility name + point, within district
  2:
    - nominatim_self_hosted   # OSM; public instance 1 req/s, no bulk, no patient data
    - opencage                # 2,500/day free, paid from ~$50/mo, storage allowed
    - mapbox                  # 100k/month free, $0.75/1k, storage restrictions
  3:
    - map_picker              # human click; every click becomes an alias row
    - alias_table             # written text -> canonical pcode/facility

resolver:
  signature: "resolve_location(district, locality, place, province=None, context=None)"
  order:
    - district -> province
    - administrative_post within district
    - facility within district
    - ADM4 within administrative_post/district
    - tier 2 geocoder
    - tier 3 map picker
  returns: "candidates[] with level, name, pcode, lat, lon, province, district, admin_post, score, source"

notes: >
  The v5 cabo_delgado_admin.db had 11 provinces, 159 districts, 411 administrative
  posts and no localities; it is national but older and incomplete. Replace it with
  the COD-AB v02 files. The card's "Localidade" is ADM3 in the Namogelia/Bilibiza
  example; the card's "Unidade Sanitária/Aldeia" is a facility in the Impiri and
  Bilibiza examples and an ADM4 in others. Return both and let the user confirm.
