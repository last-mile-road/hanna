# Testing default: OpenRouter Qwen3.5 9B for every block, Qwen3-VL 8B as the
# fallback. The Modal box is out of the loop until the rest of the infrastructure
# is in place. For local MinerU on the two table blocks, run the server and worker
# with HANNA_ROUTING_FILE=routing-local.yaml and MINERU_LOCAL_BASE set.
#
# A controlled reader (MinerU) has no fallback by design: a failure is surfaced
# and fixed structurally, not hidden behind a different model.
strips: or-qwen35-9b-v1
fallback: or-qwen3vl-8b-v1
default: or-qwen35-9b-v1
blocks: {}
