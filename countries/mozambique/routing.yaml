  visit1_nerve: mineru-standard
  visit2_nerve: mineru-standard
  visit3_nerve: mineru-standard
  visit4_nerve: mineru-standard
  visit1_def_exam: mineru-standard
  visit2_def_exam: mineru-standard
  visit3_def_exam: mineru-standard
  visit4_def_exam: mineru-standard
